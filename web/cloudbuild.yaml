# Cloud Build — sagiggun admin web (Cloud Run, asia-northeast3)
#
# 수동 배포:
#   gcloud builds submit --config cloudbuild.yaml --project=$GCP_PROJECT_ID .
#
# nngn-ops 패턴: Artifact Registry → Cloud Run + Cloud SQL + Secret Manager
# 사전: infra/scripts/*.sh 및 docs/deploy-gcp.md 참고
#
# 플레이스홀더를 실제 값으로 바꾸거나, 제출 시 substitutions 사용:
#   --substitutions=_REGION=asia-northeast3,_SERVICE=sagiggun,_AR_REPO=sagiggun,_SQL_INSTANCE=moonlit-prod,_LLM_MODE=live,_LLM_PROVIDER=openai,_LLM_MODEL=gpt-5.6-luna,_LLM_REASONING=high

substitutions:
  _REGION: asia-northeast3
  _SERVICE: sagiggun
  _AR_REPO: sagiggun
  _SQL_INSTANCE: moonlit-prod
  _SA: sa-sagiggun-run
  _LLM_MODE: live
  _LLM_PROVIDER: openai
  _LLM_MODEL: gpt-5.6-luna
  _LLM_REASONING: high

steps:
  - name: "bash"
    script: |
      TAG="${COMMIT_SHA:-$(date +%Y%m%d-%H%M%S)}"
      echo "$TAG" > /workspace/image-tag.txt
      echo "Image tag: $TAG"

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        TAG=$$(cat /workspace/image-tag.txt)
        docker buildx build --platform=linux/amd64 \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$$TAG \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest \
          --push .
    timeout: 1200s

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        TAG=$$(cat /workspace/image-tag.txt)
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$$TAG \
          --platform=managed \
          --region=${_REGION} \
          --allow-unauthenticated \
          --port=8080 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --concurrency=20 \
          --timeout=300 \
          --cpu-boost \
          --service-account=${_SA}@$PROJECT_ID.iam.gserviceaccount.com \
          --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE} \
          --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,LLM_CONFIG_SECRET=${_SERVICE}-llm-config,LLM_MODE=${_LLM_MODE},LLM_PROVIDER=${_LLM_PROVIDER},LLM_MODEL=${_LLM_MODEL},LLM_REASONING=${_LLM_REASONING},PHOTO_DIR=/tmp/photos,PHOTO_BUCKET=${_SERVICE}-photos \
          --set-secrets=DATABASE_URL=${_SERVICE}-database-url:latest,ADMIN_PASSWORD=${_SERVICE}-admin-password:latest,SESSION_SECRET=${_SERVICE}-session-secret:latest,ANTHROPIC_API_KEY=${_SERVICE}-anthropic-api-key:latest,OPENAI_API_KEY=${_SERVICE}-openai-api-key:latest,OPS_API_TOKEN=${_SERVICE}-ops-api-token:latest
    timeout: 300s

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
